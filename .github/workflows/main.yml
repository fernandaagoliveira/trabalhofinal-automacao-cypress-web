name: Pipeline de Testes Automatizados com Cypress

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  executar-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js versão 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependências
        run: npm ci
        env:
          NODE_ENV: development

      - name: Executar testes em modo headless
        run: npx cypress run

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios-cypress
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos